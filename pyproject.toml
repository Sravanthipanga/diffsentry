[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsentry"
version = "0.1.0"
description = "DiffSentry — AI-powered code review CLI with schema-enforced structured output, AST-aware diff chunking, and a measurable eval gate"
license = { text = "ISC" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
diffsentry = "diffsentry.cli:app"

[tool.setuptools.packages.find]
include = ["diffsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
